# Fly.io — BizOS Backend
# Deploy: fly launch  (first time)
#         fly deploy  (updates)
# Secrets: fly secrets set SECRET_KEY=... DATABASE_URL=... CORS_ORIGINS=... etc.

app = "bizos-api"        # change to your preferred app name (must be globally unique on fly.io)
primary_region = "lhr"   # London — change to nearest: iad=US-East, sin=Singapore, syd=Sydney

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep always-on (no cold starts)
  auto_start_machines = true
  min_machines_running = 1

[env]
  ENV = "production"
  DEBUG = "false"
  WEB_CONCURRENCY = "2"        # 2 workers fits in 256 MB RAM

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
