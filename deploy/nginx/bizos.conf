# BizOS — nginx server block
# ─────────────────────────────────────────────────────────────────────────────
# SETUP:
#   1. Replace every occurrence of "bizos.YOURDOMAIN.COM" with your real subdomain
#   2. cp deploy/nginx/bizos.conf /etc/nginx/sites-available/bizos
#   3. ln -s /etc/nginx/sites-available/bizos /etc/nginx/sites-enabled/bizos
#   4. certbot --nginx -d bizos.YOURDOMAIN.COM
#   5. nginx -t && systemctl reload nginx
#
# ARCHITECTURE (single subdomain — avoids all CORS + cookie issues):
#   bizos.YOURDOMAIN.COM/api/v1/*  →  FastAPI  (127.0.0.1:8001)
#   bizos.YOURDOMAIN.COM/*         →  Next.js  (127.0.0.1:3001)
# ─────────────────────────────────────────────────────────────────────────────

upstream bizos_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream bizos_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name bizos.YOURDOMAIN.COM;
    return 301 https://$host$request_uri;
}

# Main HTTPS block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bizos.YOURDOMAIN.COM;

    # SSL — certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/bizos.YOURDOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bizos.YOURDOMAIN.COM/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── FastAPI backend: /api/* and /health ──────────────────────────────────
    location ~ ^/(api|health) {
        proxy_pass         http://bizos_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }

    # ── Next.js static assets: long-lived cache (content-hashed filenames) ───
    location /_next/static/ {
        proxy_pass         http://bizos_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # ── PWA icons & public files ──────────────────────────────────────────────
    location /icons/ {
        proxy_pass         http://bizos_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            7d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # ── Service worker & web manifest: never cache ───────────────────────────
    location ~* \.(webmanifest|json)$ {
        proxy_pass         http://bizos_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-cache";
    }

    location = /sw.js {
        proxy_pass         http://bizos_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Everything else → Next.js ─────────────────────────────────────────────
    location / {
        proxy_pass         http://bizos_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
